<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Color Responsive Visualizer</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons for stylish UI icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Smooth background transitions */
        body, #color-canvas {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation;
        }

        /* Glassmorphism styling for control panel */
        .glass-panel {
            background: rgba(18, 18, 24, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Custom styling for color picker wrapper */
        .color-picker-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 9999px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .color-picker-wrapper:hover {
            transform: scale(1.08);
        }
        .color-picker-input {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            cursor: pointer;
            border: none;
        }

        /* Select Input Styling */
        select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            outline: none;
        }
        select option {
            background-color: #18181b;
            color: #ffffff;
        }

        /* Custom range slider styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            height: 6px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            transition: background-color 0.15s, transform 0.15s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* UI elements fade animation */
        .ui-fade {
            transition: opacity 0.3s ease-in-out;
        }

        /* Hide scrollbars for slick look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-black text-white relative flex items-center justify-center select-none">

    <!-- Fullscreen animated color background canvas -->
    <div id="color-canvas" class="absolute inset-0"></div>

    <!-- UI Overlay Panel -->
    <div id="ui-panel" class="ui-fade absolute top-6 left-6 z-10 w-80 max-w-[calc(100vw-3rem)] glass-panel rounded-2xl p-5 text-sm transform ease-in-out">
        <!-- Panel Header -->
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center space-x-2">
                <i class="ph ph-waveform text-xl text-indigo-400"></i>
                <h1 class="font-bold text-base text-gray-100 tracking-wide">Audio Color Sync</h1>
            </div>
            <button id="toggle-panel-btn" class="text-gray-400 hover:text-white transition-colors p-1 rounded-lg hover:bg-white/10" title="パネルを折りたたむ">
                <i id="toggle-icon" class="ph ph-caret-up text-lg"></i>
            </button>
        </div>

        <!-- Panel Body Content -->
        <div id="panel-content" class="space-y-5 transition-all duration-300">
            <!-- Start / Stop Microphone Button -->
            <div>
                <button id="mic-toggle-btn" class="w-full py-3 px-4 rounded-xl font-semibold flex items-center justify-center space-x-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 active:scale-95 transition-all duration-200 shadow-lg text-white">
                    <i id="mic-icon" class="ph ph-microphone text-lg"></i>
                    <span id="mic-btn-text">マイクを開始する</span>
                </button>
            </div>

            <!-- Volume Level Meter -->
            <div class="space-y-1">
                <div class="flex justify-between text-xs text-gray-300 font-medium">
                    <span>音量レベル</span>
                    <span id="volume-percent-text">0%</span>
                </div>
                <div class="w-full bg-black/40 rounded-full h-2.5 p-0.5 border border-white/10">
                    <div id="volume-bar" class="bg-gradient-to-r from-emerald-400 via-yellow-400 to-rose-500 h-1.5 rounded-full w-0 transition-all duration-75"></div>
                </div>
            </div>

            <hr class="border-white/10 my-3">

            <!-- Dynamic Color Palette Settings -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-gray-300 uppercase tracking-wider">使用する色の数</label>
                    <select id="color-count-select" class="px-2.5 py-1 rounded-lg text-xs font-medium cursor-pointer border border-white/20 focus:border-indigo-400">
                        <option value="1">1 色</option>
                        <option value="2">2 色</option>
                        <option value="3" selected>3 色</option>
                        <option value="4">4 色</option>
                        <option value="5">5 色</option>
                    </select>
                </div>

                <!-- Color Pickers Container -->
                <div id="colors-container" class="flex flex-wrap gap-3 justify-start pt-1">
                    <!-- Dynamic color pickers will be injected here by JS -->
                </div>
            </div>

            <!-- Settings Sliders -->
            <div class="space-y-4 pt-1">
                <!-- Sensitivity / Gain Control -->
                <div class="space-y-1">
                    <div class="flex justify-between text-xs text-gray-300">
                        <span>マイク感度</span>
                        <span id="sensitivity-value" class="font-mono text-indigo-300">1.5x</span>
                    </div>
                    <input type="range" id="sensitivity-slider" min="0.5" max="4.0" step="0.1" value="1.5" class="w-full">
                </div>

                <!-- Smoothness / Response Speed Control -->
                <div class="space-y-1">
                    <div class="flex justify-between text-xs text-gray-300">
                        <span>滑らかさ (レスポンス)</span>
                        <span id="smoothness-value" class="font-mono text-indigo-300">0.08</span>
                    </div>
                    <input type="range" id="smoothness-slider" min="0.01" max="0.30" step="0.01" value="0.08" class="w-full">
                </div>
            </div>

            <!-- Shortcut Hint inside panel -->
            <div class="pt-2 border-t border-white/10 text-[11px] text-gray-400 flex items-center space-x-1.5 justify-center text-center">
                <i class="ph ph-hand-tap text-sm text-indigo-300"></i>
                <span>画面長押し または <kbd class="px-1.5 py-0.5 bg-white/10 rounded border border-white/20 font-mono text-[10px] text-gray-200">S</kbd> キーでUI非表示</span>
            </div>
        </div>
    </div>

    <!-- Instructions Notice when inactive -->
    <div id="welcome-message" class="ui-fade absolute bottom-8 left-1/2 transform -translate-x-1/2 glass-panel px-6 py-3 rounded-full text-xs text-gray-300 pointer-events-none transition-opacity duration-300 flex items-center space-x-2">
        <i class="ph ph-info text-base text-indigo-400"></i>
        <span>マイクをONにすると音に合わせて色が変化（画面長押し/SキーでUI非表示）</span>
    </div>

    <script>
        // --- Web Audio API & Audio Processing Logic ---
        let audioContext = null;
        let analyser = null;
        let microphoneStream = null;
        let dataArray = null;
        let isListening = false;

        // Current and Target Audio Volume Normalized (0.0 to 1.0)
        let currentVolume = 0;
        let targetVolume = 0;

        // Smooth color animation state variables
        let colorCyclePhase = 0;

        // Default colors palette list (up to 5 colors)
        const defaultColorHexes = ['#4f46e5', '#ec4899', '#06b6d4', '#10b981', '#f59e0b'];
        let activeColors = [defaultColorHexes[0], defaultColorHexes[1], defaultColorHexes[2]];

        // DOM Element References
        const micToggleBtn = document.getElementById('mic-toggle-btn');
        const micIcon = document.getElementById('mic-icon');
        const micBtnText = document.getElementById('mic-btn-text');
        const volumeBar = document.getElementById('volume-bar');
        const volumePercentText = document.getElementById('volume-percent-text');
        const colorCanvas = document.getElementById('color-canvas');
        const welcomeMessage = document.getElementById('welcome-message');

        const colorCountSelect = document.getElementById('color-count-select');
        const colorsContainer = document.getElementById('colors-container');

        const sensitivitySlider = document.getElementById('sensitivity-slider');
        const sensitivityValue = document.getElementById('sensitivity-value');
        const smoothnessSlider = document.getElementById('smoothness-slider');
        const smoothnessValue = document.getElementById('smoothness-value');

        const uiPanel = document.getElementById('ui-panel');
        const panelContent = document.getElementById('panel-content');
        const togglePanelBtn = document.getElementById('toggle-panel-btn');
        const toggleIcon = document.getElementById('toggle-icon');

        let isUiFullyVisible = true;

        // Helper: Convert HEX color code to RGB object
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        // Linear Interpolation (Lerp) helper function
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // Interpolate RGB colors smoothly
        function lerpColor(rgb1, rgb2, t) {
            return {
                r: Math.round(lerp(rgb1.r, rgb2.r, t)),
                g: Math.round(lerp(rgb1.g, rgb2.g, t)),
                b: Math.round(lerp(rgb1.b, rgb2.b, t))
            };
        }

        // Dynamic Color Picker Rendering based on count
        function updateColorPickers(count) {
            colorsContainer.innerHTML = '';
            
            // Adjust active colors array length
            while (activeColors.length < count) {
                const nextHex = defaultColorHexes[activeColors.length % defaultColorHexes.length];
                activeColors.push(nextHex);
            }
            if (activeColors.length > count) {
                activeColors = activeColors.slice(0, count);
            }

            // Create Color Picker Inputs
            for (let i = 0; i < count; i++) {
                const colorWrapper = document.createElement('div');
                colorWrapper.className = 'flex flex-col items-center space-y-1';

                colorWrapper.innerHTML = `
                    <div class="color-picker-wrapper w-11 h-11 border-2 border-white/30 shadow-md flex items-center justify-center">
                        <input type="color" value="${activeColors[i]}" class="color-picker-input" data-index="${i}">
                    </div>
                    <span class="text-[10px] text-gray-400 font-mono">色 ${i + 1}</span>
                `;

                colorsContainer.appendChild(colorWrapper);
            }

            // Bind Event Listeners to Color Pickers
            const pickerInputs = colorsContainer.querySelectorAll('.color-picker-input');
            pickerInputs.forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'), 10);
                    activeColors[idx] = e.target.value;
                });
            });
        }

        // Initial Color Pickers Setup
        updateColorPickers(parseInt(colorCountSelect.value, 10));

        // Color Count Dropdown Change Handler
        colorCountSelect.addEventListener('change', (e) => {
            const count = parseInt(e.target.value, 10);
            updateColorPickers(count);
        });

        // --- UI Visibility Toggle Logic (Key & Long-press) ---
        function setUiVisibility(visible) {
            isUiFullyVisible = visible;
            if (isUiFullyVisible) {
                uiPanel.style.opacity = '1';
                uiPanel.style.pointerEvents = 'auto';
                welcomeMessage.style.opacity = isListening ? '0' : '1';
            } else {
                uiPanel.style.opacity = '0';
                uiPanel.style.pointerEvents = 'none';
                welcomeMessage.style.opacity = '0';
            }
        }

        function toggleUiVisibility() {
            setUiVisibility(!isUiFullyVisible);
        }

        // 1. Keyboard 'S' Key Toggle
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') {
                return;
            }
            if (e.key === 's' || e.key === 'S') {
                toggleUiVisibility();
            }
        });

        // 2. Long Press (Touch & Mouse Hold) Logic
        let longPressTimer = null;
        const LONG_PRESS_DURATION = 500; // milliseconds

        function startLongPress(e) {
            // Prevent long press trigger if interacting inside the UI panel
            if (uiPanel.contains(e.target)) {
                return;
            }
            
            cancelLongPress();
            longPressTimer = setTimeout(() => {
                toggleUiVisibility();
                cancelLongPress();
            }, LONG_PRESS_DURATION);
        }

        function cancelLongPress() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        // Mouse Events
        window.addEventListener('mousedown', startLongPress);
        window.addEventListener('mouseup', cancelLongPress);
        window.addEventListener('mousemove', cancelLongPress);

        // Touch Events
        window.addEventListener('touchstart', startLongPress, { passive: true });
        window.addEventListener('touchend', cancelLongPress);
        window.addEventListener('touchmove', cancelLongPress);

        // Start Microphone Audio Stream
        async function startMicrophone() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                microphoneStream = stream;

                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.8;
                
                source.connect(analyser);

                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isListening = true;

                // Update UI state
                micBtnText.textContent = "マイクを停止する";
                micIcon.className = "ph ph-square text-lg";
                micToggleBtn.className = "w-full py-3 px-4 rounded-xl font-semibold flex items-center justify-center space-x-2 bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 active:scale-95 transition-all duration-200 shadow-lg text-white";
                if (isUiFullyVisible) {
                    welcomeMessage.style.opacity = '0';
                }

            } catch (err) {
                console.error("Microphone access error:", err);
                alert("マイクへのアクセスが拒否されたか、マイクが見つかりませんでした。ブラウザの設定でマイク権限を許可してください。");
            }
        }

        // Stop Microphone Audio Stream
        function stopMicrophone() {
            if (microphoneStream) {
                microphoneStream.getTracks().forEach(track => track.stop());
            }
            if (audioContext) {
                audioContext.close();
            }
            isListening = false;
            targetVolume = 0;

            // Update UI state
            micBtnText.textContent = "マイクを開始する";
            micIcon.className = "ph ph-microphone text-lg";
            micToggleBtn.className = "w-full py-3 px-4 rounded-xl font-semibold flex items-center justify-center space-x-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 active:scale-95 transition-all duration-200 shadow-lg text-white";
            if (isUiFullyVisible) {
                welcomeMessage.style.opacity = '1';
            }
        }

        // Toggle Microphone State
        micToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isListening) {
                stopMicrophone();
            } else {
                startMicrophone();
            }
        });

        // Event Listeners for UI Sliders
        sensitivitySlider.addEventListener('input', (e) => {
            sensitivityValue.textContent = parseFloat(e.target.value).toFixed(1) + 'x';
        });

        smoothnessSlider.addEventListener('input', (e) => {
            smoothnessValue.textContent = parseFloat(e.target.value).toFixed(2);
        });

        // Collapse / Expand Control Panel UI
        let isPanelOpen = true;
        togglePanelBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isPanelOpen = !isPanelOpen;
            if (isPanelOpen) {
                panelContent.classList.remove('hidden');
                toggleIcon.className = "ph ph-caret-up text-lg";
            } else {
                panelContent.classList.add('hidden');
                toggleIcon.className = "ph ph-caret-down text-lg";
            }
        });

        // Main Animation & Render Loop (requestAnimationFrame)
        function renderLoop() {
            // Calculate Audio Amplitude if mic is active
            if (isListening && analyser) {
                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                const average = sum / dataArray.length;
                
                const gain = parseFloat(sensitivitySlider.value);
                let normalizedVol = (average / 128.0) * gain;
                targetVolume = Math.min(Math.max(normalizedVol, 0), 1.0);
            } else {
                targetVolume = 0;
            }

            // Smooth volume parameter using Lerp
            const smoothFactor = parseFloat(smoothnessSlider.value);
            currentVolume = lerp(currentVolume, targetVolume, smoothFactor);

            // Update Volume Level Indicator Bar
            const displayVolPercent = Math.round(currentVolume * 100);
            volumeBar.style.width = `${displayVolPercent}%`;
            volumePercentText.textContent = `${displayVolPercent}%`;

            // Convert Hex Colors to RGB Objects
            const rgbColors = activeColors.map(hex => hexToRgb(hex));

            // Cycle color blend phase slowly over time
            colorCyclePhase += 0.005 + (currentVolume * 0.02);
            
            let finalColor1, finalColor2;
            const quietTone = { r: 12, g: 14, b: 20 }; // Ambient dark tone when quiet

            if (rgbColors.length === 1) {
                // Single color mode
                const c1 = rgbColors[0];
                finalColor1 = lerpColor(quietTone, c1, currentVolume);
                finalColor2 = lerpColor(quietTone, { r: Math.max(0, c1.r - 40), g: Math.max(0, c1.g - 40), b: Math.max(0, c1.b - 40) }, currentVolume * 0.8);
            } else {
                // Multi-color cycle mode (2 to 5 colors)
                const numColors = rgbColors.length;
                const normalizedPhase = (colorCyclePhase % numColors);
                const currentIndex = Math.floor(normalizedPhase);
                const nextIndex = (currentIndex + 1) % numColors;
                const blendRatio = normalizedPhase - currentIndex;

                const baseColor1 = lerpColor(rgbColors[currentIndex], rgbColors[nextIndex], blendRatio);
                const baseColor2 = lerpColor(rgbColors[(currentIndex + 1) % numColors], rgbColors[(nextIndex + 1) % numColors], blendRatio);

                finalColor1 = lerpColor(quietTone, baseColor1, currentVolume);
                finalColor2 = lerpColor(quietTone, baseColor2, currentVolume * 0.85);
            }

            // Apply smooth Radial + Linear Gradient Background
            colorCanvas.style.background = `
                radial-gradient(circle at 50% 50%, 
                    rgb(${finalColor1.r}, ${finalColor1.g}, ${finalColor1.b}) 0%, 
                    rgb(${finalColor2.r}, ${finalColor2.g}, ${finalColor2.b}) 100%)
            `;

            // Request next frame
            requestAnimationFrame(renderLoop);
        }

        // Start render loop on window load
        window.onload = () => {
            renderLoop();
        };
    </script>
</body>
</html>
